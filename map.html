<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forecast Components Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one control row, the state map with its legend, then a ranked list of states. Same type and tokens as the race explorer. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --ink: #1b1f27; --muted: #5d6573; --line: #d9dde4; --nodata: #e6e8ec;
  --dem: #2457c5; --rep: #c8322f; --mid: #eeedea; --seq-lo: #f7e6dc; --seq-hi: #b8441a; --focus: #7a4fd6;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --surface: #1a1e26; --ink: #e8eaef; --muted: #9aa2b0; --line: #2d333e; --nodata: #232831;
  --dem: #5b8cf0; --rep: #ef5f58; --mid: #3a3a37; --seq-lo: #3a2a22; --seq-hi: #f08a5e; --focus: #a98bf0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --ink: #e8eaef; --muted: #9aa2b0; --line: #2d333e; --nodata: #232831;
  --dem: #5b8cf0; --rep: #ef5f58; --mid: #3a3a37; --seq-lo: #3a2a22; --seq-hi: #f08a5e; --focus: #a98bf0; color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body) }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 20px }
h1 { font: 700 32px/1.05 var(--display); letter-spacing: .01em; margin: 0; text-wrap: balance }
.sub { color: var(--muted); font-size: 13px }
a { color: var(--ink) }
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface) }
.seg button { border: 0; background: none; padding: 7px 14px; font: 500 13px var(--body); color: var(--muted); cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }
select { font: 13px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; max-width: 100% }
button:focus-visible, select:focus-visible, path:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0 }
.panel h2 { font: 600 20px var(--display); margin: 0; letter-spacing: .02em }
#map { width: 100%; height: auto; display: block }
#map path { stroke: var(--surface); stroke-width: .8; cursor: pointer; transition: fill .2s }
#map path:hover { stroke: var(--ink); stroke-width: 1.6 }
@media (prefers-reduced-motion: reduce) { #map path { transition: none } }
.legend { display: grid; grid-template-columns: auto minmax(0, 320px) auto; gap: 8px; align-items: center; font: 12px var(--mono); color: var(--muted) }
.ramp { height: 10px; border-radius: 2px }
.lg-extra { display: flex; gap: 14px; font-size: 12px; color: var(--muted); align-items: center; flex-wrap: wrap }
.sw { width: 14px; height: 10px; border-radius: 2px; display: inline-block; background: var(--nodata); vertical-align: middle; margin-right: 6px }
.tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.15); max-width: 260px; z-index: 5 }
.tip .v { font: 500 13px var(--mono) }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px 16px; font-size: 13px }
.list div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 3px 0 }
.list .v { font-family: var(--mono); font-variant-numeric: tabular-nums }
.dem { color: var(--dem) } .rep { color: var(--rep) }
.note { font-size: 12px; color: var(--muted); max-width: 90ch; margin: 0 }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Forecast Components Map</h1>
      <div class="sub" id="asof"></div>
    </div>
    <a href="index.html">← Race explorer</a>
  </header>

  <div class="controls">
    <div class="seg" id="office" role="group" aria-label="Office">
      <button data-v="sen" aria-pressed="true">Senate race</button><button data-v="house" aria-pressed="false">House (district average)</button>
    </div>
    <label class="sub" for="metric">Show <select id="metric"></select></label>
  </div>

  <section class="panel" aria-labelledby="mtitle">
    <h2 id="mtitle"></h2>
    <p class="note" id="mnote"></p>
    <svg id="map" role="img" aria-labelledby="mtitle"></svg>
    <div class="legend" id="legend"></div>
    <div class="lg-extra"><span><span class="sw"></span>No race / no data</span></div>
  </section>

  <section class="panel" aria-labelledby="ltitle">
    <h2 id="ltitle">States, ranked</h2>
    <div class="list" id="list"></div>
  </section>
</div>
<div class="tip" id="tip" hidden></div>

<script src="components_2026.js"></script>
<script>
(() => {
const D = window.COMPONENTS, $ = id => document.getElementById(id), NS = "http://www.w3.org/2000/svg";
const NAMES = {AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",CT:"Connecticut",DE:"Delaware",FL:"Florida",GA:"Georgia",HI:"Hawaii",ID:"Idaho",IL:"Illinois",IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",MN:"Minnesota",MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",OR:"Oregon",PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming",DC:"District of Columbia"};
const NOTES = {
  margin: "Points of margin, Democrat minus Republican: blue helps Democrats, red helps Republicans.",
  prob: "Chance the Democrat wins: blue above 50%, red below.",
  share: "How much of the forecast's information comes from polls (the rest is fundamentals).",
  count: "Polls in the average.",
  raw: "The input's own units, before the model weights it."
};
let office = "sen", metric = D.metrics[0].key;
$("asof").textContent = `2026 forecast as of ${new Date(D.asof + "T12:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })}`;
const groups = [...new Set(D.metrics.map(m => m.group))];
$("metric").innerHTML = groups.map(g => `<optgroup label="${g}">` + D.metrics.filter(m => m.group === g).map(m => `<option value="${m.key}">${m.label}</option>`).join("") + "</optgroup>").join("");

// colors: diverging blue <-> neutral <-> red, sequential neutral -> orange (read from the theme tokens)
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hex = h => { h = h.replace("#", ""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const mix = (a, b, t) => "rgb(" + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(",") + ")";
function scale(m, vals) {
  const dem = hex(css("--dem")), rep = hex(css("--rep")), mid = hex(css("--mid")), lo = hex(css("--seq-lo")), hi = hex(css("--seq-hi"));
  if (m.kind === "share" || m.kind === "count") {
    const mx = Math.max(...vals, m.kind === "share" ? 1e-6 : 1);
    const top = m.kind === "share" ? 1 : mx;
    return { f: v => mix(lo, hi, Math.min(Math.max(v / top, 0), 1)), lo: 0, hi: top, ramp: `linear-gradient(90deg, ${mix(lo, hi, 0)}, ${mix(lo, hi, 1)})` };
  }
  const c = m.kind === "prob" ? 0.5 : 0;
  const dev = vals.map(v => Math.abs(v - c)).sort((a, b) => a - b);
  let M = dev.length ? dev[Math.floor(0.95 * (dev.length - 1))] : 1;
  if (m.kind === "prob") M = 0.5;
  M = M || 1;
  return { f: v => { const t = Math.max(-1, Math.min(1, (v - c) / M)); return t >= 0 ? mix(mid, dem, t) : mix(mid, rep, -t); },
           lo: c - M, hi: c + M, ramp: `linear-gradient(90deg, ${mix(mid, rep, 1)}, ${mix(mid, mid, 0)}, ${mix(mid, dem, 1)})` };
}
const fmt = (m, v) => v == null ? "–" : m.kind === "prob" ? Math.round(v * 100) + "%" : m.kind === "share" ? Math.round(v * 100) + "%" :
  m.kind === "count" ? String(Math.round(v)) : m.kind === "margin" ? (Math.abs(v) < 0.05 ? "Even" : (v > 0 ? "D+" : "R+") + Math.abs(v).toFixed(1)) :
  (v > 0 ? "+" : "") + v.toFixed(2);

// map
const svg = $("map"), [VW, VH] = D.viewbox;
svg.setAttribute("viewBox", `0 0 ${VW} ${VH}`);
const paths = {};
for (const st of Object.keys(D.geo).filter(k => !k.endsWith("_c"))) {
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", D.geo[st]); p.setAttribute("tabindex", "0"); p.dataset.st = st;
  svg.appendChild(p); paths[st] = p;
}
const tip = $("tip");
function showTip(ev, st) {
  const m = D.metrics.find(x => x.key === metric), rec = (office === "sen" ? D.sen : D.house)[st];
  let h = `<b>${NAMES[st] || st}</b><br>`;
  if (!rec) h += office === "sen" ? "No Senate race in 2026" : "No contested House races";
  else {
    h += `${m.label}: <span class="v">${fmt(m, rec[metric])}</span><br>`;
    h += office === "sen" ? `${rec.dem || "–"} (D) vs ${rec.rep || "–"} (R)${rec.special ? " · special" : ""}<br>Forecast ${fmt({ kind: "margin" }, rec.forecast)} · ${Math.round(rec.p_dem * 100)}% D`
                          : `${rec.n} contested districts · ${rec.seats_d} expected D seats`;
  }
  tip.innerHTML = h; tip.hidden = false;
  const r = ev.clientX != null ? { x: ev.clientX, y: ev.clientY } : (() => { const b = ev.target.getBoundingClientRect(); return { x: b.right, y: b.top }; })();
  tip.style.left = Math.min(r.x + 14, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.min(r.y + 14, innerHeight - tip.offsetHeight - 8) + "px";
}
for (const [st, p] of Object.entries(paths)) {
  p.addEventListener("mousemove", ev => showTip(ev, st));
  p.addEventListener("focus", ev => showTip(ev, st));
  p.addEventListener("mouseleave", () => tip.hidden = true);
  p.addEventListener("blur", () => tip.hidden = true);
}

function render() {
  const m = D.metrics.find(x => x.key === metric), data = office === "sen" ? D.sen : D.house;
  const vals = Object.values(data).map(r => r[metric]).filter(v => v != null);
  const sc = scale(m, vals);
  $("mtitle").textContent = `${m.label} · ${office === "sen" ? "Senate race" : "House, average over districts"}`;
  $("mnote").textContent = NOTES[m.kind] + (m.group === "Fundamentals drivers" ? " Each value is how much this input moves the no-polls forecast." : "");
  for (const [st, p] of Object.entries(paths)) {
    const rec = data[st], v = rec ? rec[metric] : null;
    p.style.fill = v == null ? "var(--nodata)" : sc.f(v);
    p.setAttribute("aria-label", `${NAMES[st] || st}: ${v == null ? "no data" : fmt(m, v)}`);
  }
  $("legend").innerHTML = `<span>${fmt(m, sc.lo)}</span><div class="ramp" style="background:${sc.ramp}"></div><span>${fmt(m, sc.hi)}</span>`;
  const ranked = Object.entries(data).filter(([, r]) => r[metric] != null).sort((a, b) => b[1][metric] - a[1][metric]);
  $("list").innerHTML = ranked.map(([st, r]) => {
    const v = r[metric], cls = (m.kind === "margin" || m.kind === "raw") ? (v > 0 ? "dem" : v < 0 ? "rep" : "") : m.kind === "prob" ? (v > .5 ? "dem" : "rep") : "";
    return `<div><span>${NAMES[st] || st}</span><span class="v ${cls}">${fmt(m, v)}</span></div>`;
  }).join("");
}
$("office").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
  $("office").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); office = b.dataset.v; render(); }));
$("metric").addEventListener("change", e => { metric = e.target.value; render(); });
render();
})();
</script>
</body>
</html>
